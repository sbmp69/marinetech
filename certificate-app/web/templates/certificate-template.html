<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate</title>
  <style>
    @page {
      size: A4;
      margin: 0;
    }
    body {
      margin: 0;
      padding: 20mm;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    .certificate {
      border: 2px solid #000;
      padding: 20mm;
      min-height: 277mm;
      box-sizing: border-box;
      position: relative;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 24pt;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .content {
      margin: 20px 0;
    }
    .field {
      margin-bottom: 15px;
      display: flex;
    }
    .field-label {
      font-weight: bold;
      min-width: 200px;
    }
    .field-value {
      flex: 1;
    }
    .footer {
      position: absolute;
      bottom: 20mm;
      left: 20mm;
      right: 20mm;
      text-align: center;
      font-size: 10pt;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="certificate">
    <div class="header">
      <h1>Certificate of Inspection</h1>
      <div class="certificate-number">Certificate No: {{certificateNumber}}</div>
    </div>
    
    <div class="content">
      <div class="field">
        <div class="field-label">Vessel Name:</div>
        <div class="field-value">{{vesselName}}</div>
      </div>
      
      <div class="field">
        <div class="field-label">Manufactured By:</div>
        <div class="field-value">{{manufacturedBy}}</div>
      </div>
      
      <div class="field">
        <div class="field-label">Owner Name:</div>
        <div class="field-value">{{ownerName}}</div>
      </div>
      
      <!-- Add more fields as needed -->
      
    </div>
    
    <div class="footer">
      <p>This is to certify that the above details are correct at the time of inspection.</p>
      <p>Date: {{inspectionDate}}</p>
    </div>
  </div>
</body>
</html>
